[FilterPlugin]
; Additional files to package, and exclusions applied on top of UAT's defaults
; (/Content, /Resources, /Shaders, /Source, /Binaries/ThirdParty).
; Verified against EpicGames.Core.FileFilter: rules here run after the defaults,
; and a leading '-' makes an exclude rule.

; --- Extra includes -------------------------------------------------------------
/Docs/Documentation.html
/Docs/ThirdPartyNotices.txt

; --- Exclusions -----------------------------------------------------------------
; Import sources. The .uasset files already carry this data, so shipping the raw
; art again would add ~694 MB of redundant download for no customer benefit.
; They stay in the working tree because reimport still needs them locally.
-/Content/.../*.png
-/Content/.../*.hdr
-/Content/.../*.fbx

; Automation tests. UAT's built-in "/Tests/..." rule only covers a Tests folder at
; the plugin root, not Source/MixtormatEditor/Private/Tests, so it has to be named.
-/Source/.../Tests/...
